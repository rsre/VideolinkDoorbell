name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Build standalone protocol package
        run: |
          python -m pip install -r requirements-build.txt
          python -m build --outdir dist custom_components/videolink_doorbell/videolink_client
          python -m pip install --no-deps dist/*.whl
          python -I -c "import sys; from videolink_client import VideolinkClient; assert 'homeassistant' not in sys.modules"
      - name: Check Python code style
        run: ruff check .
      - name: Run frontend tests
        run: node --test tests/videolink-card.test.js
      - name: Validate HACS bundle and build standalone card
        run: python tools/build_frontend.py --check-bundle --output-dir frontend/dist

  home-assistant-tests:
    name: Home Assistant lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-ha-test.txt
      - name: Run real Home Assistant tests
        run: python -m pytest -q tests/ha tests/test_event.py

  browser-tests:
    name: Browser WebSocket lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-ha-test.txt
            requirements-browser-test.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser-test.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser
          npm run build --prefix tests/browser
      - name: Run card against the Home Assistant WebSocket server
        env:
          VIDEOLINK_BROWSER_TESTS: "1"
        run: python -m pytest -q tests/ha/test_browser_lifecycle.py
